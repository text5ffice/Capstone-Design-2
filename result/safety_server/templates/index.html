<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>스마트 안전 감지 시스템</title>
    <style>
        body { margin: 0; padding: 0; height: 100vh; background-color: #222; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        #start-screen { text-align: center; display: flex; flex-direction: column; gap: 20px; }
        .btn-start { padding: 20px 50px; font-size: 2rem; font-weight: bold; background: #00ffcc; border: none; border-radius: 10px; cursor: pointer; }
        
        #inspection-screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 30px; }
        .msg-box { font-size: 3rem; font-weight: bold; margin-bottom: 20px; text-align: center; min-height: 100px; white-space: pre-wrap;}
        .video-box { width: 90%; max-width: 1000px; aspect-ratio: 16/9; background: black; border: 5px solid #555; position: relative; }
        img { width: 100%; height: 100%; object-fit: contain; }

        .bg-fail { background-color: #e74c3c !important; }
        .bg-pass { background-color: #2ecc71 !important; }
        .settings { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; display: flex; gap: 15px; }
        label { display: flex; align-items: center; font-size: 1.2rem; cursor: pointer; }
        input { width: 20px; height: 20px; margin-right: 5px; }
    </style>
</head>
<body>
    <audio id="welcome" src="/audio/welcome.wav"></audio>
    <audio id="request" src="/audio/request.wav"></audio>
    <audio id="recheck" src="/audio/recheck.wav"></audio>
    <audio id="pass" src="/audio/pass.wav"></audio>

    <div id="start-screen">
        <h1>🚧 안전 장비 검사 시스템</h1>
        <div class="settings">
            <label><input type="checkbox" id="chk-helmet" checked>안전모</label>
            <label><input type="checkbox" id="chk-vest" checked>조끼</label>
            <label><input type="checkbox" id="chk-mask">마스크</label>
            <label><input type="checkbox" id="chk-gloves">장갑</label>
        </div>
        <button class="btn-start" onclick="initProcess()">시스템 가동</button>
    </div>

    <div id="inspection-screen">
        <div id="status-msg" class="msg-box">준비 중...</div>
        <div class="video-box">
            <img src="{{ url_for('video_feed') }}">
        </div>
        <button onclick="stopInspection()" style="margin-top:20px; padding:10px 30px; background:#444; color:white; border:none; border-radius:20px; cursor:pointer;">처음으로</button>
    </div>

    <script>
        let checkInterval = null;
        let isStopping = false;
        let previousStatus = "IDLE";

        window.onload = function() { stopInspection(); };

        function setSystemActive(isActive) {
            fetch('/set_active', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({active: isActive})
            }).catch(e => console.log(e));
        }

        function initProcess() {
            updateSettings();
            isStopping = false;
            previousStatus = "IDLE";
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('inspection-screen').style.display = 'flex';
            setMessage("잠시 후 시스템이 시작됩니다");

            playAudio('welcome', () => {
                if(isStopping) return;
                startLoop(); 
            });
        }

        function stopInspection() {
            isStopping = true;
            if (checkInterval) { clearInterval(checkInterval); checkInterval = null; }
            setSystemActive(false);
            
            document.body.className = '';
            document.getElementById('inspection-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            
            stopAllAudio();
        }

        function stopAllAudio() {
            const audios = ['welcome', 'request', 'recheck', 'pass'];
            audios.forEach(id => {
                const el = document.getElementById(id);
                if(el) { el.pause(); el.currentTime = 0; }
            });
        }

        function startLoop() {
            if(isStopping) return;
            setSystemActive(true); 
            document.body.className = '';
            setMessage("카드를 태그해주세요"); 
            
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(checkStatus, 500);
        }

        function checkStatus() {
            if (isStopping) return;

            fetch('/current_status')
                .then(res => res.json())
                .then(data => {
                    if (isStopping) return;

                    // 상태가 변했을 때만 오디오 및 배경색 변경 재생
                    if (data.status !== previousStatus) {
                        previousStatus = data.status;
                        
                        if (data.status === 'OK') {
                            document.body.className = 'bg-pass';
                            playAudio('pass');
                        } else if (data.status === 'WARNING') {
                            document.body.className = 'bg-fail';
                            playAudio('request', () => { playAudio('recheck'); });
                        } else if (data.status === 'REJECT') {
                            document.body.className = 'bg-fail';
                        } else {
                            document.body.className = '';
                        }
                    }

                    // 상태에 따른 화면 텍스트 렌더링
                    if (data.status === 'WAIT_SCANNING') {
                        setMessage("신원 확인됨: [" + data.worker + "]\n" + data.countdown + "초 후 검사 시작...");
                    } else if (data.status === 'SCANNING') {
                        setMessage("안전장비 검사 중...");
                    } else if (data.status === 'OK') {
                        setMessage("✅ 통과입니다! [" + data.worker + "]\n" + data.countdown + "초 후 닫힙니다");
                    } else if (data.status === 'WARNING') {
                        const korMap = {'helmet':'안전모', 'vest':'조끼', 'mask':'마스크', 'gloves':'장갑'};
                        const missingText = data.missing.map(m => korMap[m] || m).join(', ');
                        setMessage("미착용: " + missingText + "\n" + data.countdown + "초 후 자동 재검사...");
                    } else if (data.status === 'REJECT') {
                        setMessage("🚫 미등록 카드입니다!\n" + data.countdown + "초 후 초기화...");
                    } else {
                        setMessage("카드를 태그해주세요");
                    }
                })
                .catch(err => console.log("통신 에러"));
        }

        function setMessage(text) {
            document.getElementById('status-msg').innerText = text;
        }

        function playAudio(id, callback) {
            if(isStopping) return;
            const audio = document.getElementById(id);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
                if (callback) audio.onended = callback;
            } else if (callback) { callback(); }
        }

        function updateSettings() {
            const settings = {
                helmet: document.getElementById('chk-helmet').checked,
                vest: document.getElementById('chk-vest').checked,
                mask: document.getElementById('chk-mask').checked,
                gloves: document.getElementById('chk-gloves').checked
            };
            fetch('/update_settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(settings)
            });
        }
    </script>
</body>
</html>
